name: Publish Documentation

on:
  pull_request: {}
  push:
    branches: [main]
    tags: ['**']

env:
  FORCE_COLOR: "1"
  COLUMNS: "120"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout and prepare git.
      - name: checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
      - uses: actions/checkout@v6
      - name: Set git credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # Setup uv and install dependencies in a venv.
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv venv --python=3.15 .docs-venv
      - run: echo "$PWD/.docs-venv/bin" >> $GITHUB_PATH
      - run: >-
          uv pip install
          --python=.docs-venv/bin/python
          --require-hashes
          --no-deps
          -r requirements-docs.txt
      - run: >-
          uv pip install
          --python=.docs-venv/bin/python
          --editable .
          --no-deps
      - run: uv pip check --python=.docs-venv/bin/python

      # Gather version from release.
      - id: check-version
        uses: samuelcolvin/check-python-version@v5
        with:
          version_file_path: 'src/goose/_version.py'
          skip_env_check: true
          version_pattern: (?im)^(?:__version__|VERSION)\s*=(?:.*=)?\s*(['"])v?(?P<version>.+?)\1

      # Smoke test in PRs that docs building isn't erroring.
      - if: "github.event_name == 'pull_request'"
        run: mike deploy pr-${{ github.sha }}

      # On push on main branch, build and push the dev version.
      - if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
        run: >-
          mike deploy
          --branch=gh-pages
          dev
          --push

      # On release, build and push for the released version and also push to "latest".
      - if: >-
          github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/')
          && !fromJSON(steps.check-version.outputs.IS_PRERELEASE)
        run: >-
          mike deploy
          --branch=gh-pages
          ${{ steps.check-version.outputs.VERSION_MAJOR_MINOR }}
          latest
          --update-aliases
          --push
